version: 2
updates:
  # Maven dependencies (Spring Boot, plugins, libraries)
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
      time: "05:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 10
    target-branch: "master"
    assignees:
      - "hendisantika"
    labels:
      - "dependencies"
      - "java"
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: "scope"
    groups:
      # Spring Boot parent & starters move together
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
      # Google Cloud build plugins (Jib, App Engine)
      google-cloud-tools:
        patterns:
          - "com.google.cloud.tools:*"
      dekorate:
        patterns:
          - "io.dekorate:*"
      # Everything else: batch minor & patch bumps into a single PR.
      # Exclude the named groups above, otherwise Dependabot treats this
      # update-types group as "more specific" and steals their dependencies.
      maven-minor-patch:
        exclude-patterns:
          - "org.springframework.boot:*"
          - "com.google.cloud.tools:*"
          - "io.dekorate:*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used in workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "05:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 10
    target-branch: "master"
    assignees:
      - "hendisantika"
    labels:
      - "dependencies"
      - "github_actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
